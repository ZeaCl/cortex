version: 0.2

env:
  variables:
    NODE_VERSION: "22"
  secrets-manager:
    NPM_TOKEN: "zea/npm/token:NPM_TOKEN"

phases:
  install:
    commands:
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      - . ~/.nvm/nvm.sh && nvm install ${NODE_VERSION} && nvm use ${NODE_VERSION}
      - cd $CODEBUILD_SRC_DIR && echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
  pre_build:
    commands:
      - cd $CODEBUILD_SRC_DIR/cli && . ~/.nvm/nvm.sh && (npm ci 2>/dev/null || npm install)
  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/cli && . ~/.nvm/nvm.sh && npm test || true
  post_build:
    commands:
      - cd $CODEBUILD_SRC_DIR/cli && . ~/.nvm/nvm.sh && npm publish --access public
