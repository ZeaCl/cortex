version: 0.2

env:
  variables:
    NODE_VERSION: "22"
  secrets-manager:
    NPM_TOKEN: "zea/npm/token:NPM_TOKEN"

phases:
  install:
    commands:
      - "echo Installing Node.js via nvm..."
      - "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash"
      - ". ~/.nvm/nvm.sh && nvm install ${NODE_VERSION}"
      - ". ~/.nvm/nvm.sh && nvm use ${NODE_VERSION}"
      - ". ~/.nvm/nvm.sh && node --version && npm --version"
      - ". ~/.nvm/nvm.sh && echo //registry.npmjs.org/:_authToken=${NPM_TOKEN} > ~/.npmrc"
  pre_build:
    commands:
      - "cd cli && . ~/.nvm/nvm.sh && npm ci"
  build:
    commands:
      - "cd cli && . ~/.nvm/nvm.sh && npm test || echo Tests failed, continuing"
  post_build:
    commands:
      - "cd cli && . ~/.nvm/nvm.sh && npm publish --access public"
