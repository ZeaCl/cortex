steps:
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "//registry.npmjs.org/:_authToken=$$NPM_TOKEN" > ~/.npmrc
        npm install --no-audit --no-fund
        npm publish --access public
        rm -f ~/.npmrc
    secretEnv: ['NPM_TOKEN']

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/zea-npm-token/versions/latest'
      env: 'NPM_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
